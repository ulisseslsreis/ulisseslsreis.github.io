project:
  type: website
  output-dir: docs

lang: pt-BR

website:
  title: "Ulisses Reis"
  site-url: https://ulisseslsreis.github.io
  description: "Site pessoal de Ulisses Reis, professor de Direito da UFERSA. Pesquisa empírica em direito constitucional, projetos de dados, apresentações e ensino."
  favicon: imagens/ulisses.png
  search: false

format:
  html:
    theme: cosmo
    css: estilos.css
    page-layout: custom
    toc: false
    # Fontes, ícones e o script que aplica o tema salvo antes de desenhar a página
    include-in-header: parciais/cabecalho.html
    # Painel de menu à esquerda (comum a todas as páginas)
    include-before-body: parciais/menu.html
    # Rodapé e scripts do menu e da troca de tema
    include-after-body: parciais/rodape.html
